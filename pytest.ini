[pytest]
; Puts the project root on sys.path before collecting tests, so
; "from services import recommender" resolves the same way whether you
; run `pytest` or `python -m pytest`. Without this, plain `pytest`
; fails with ModuleNotFoundError - `python -m pytest` only works by
; accident, because `python -m` adds the current directory to sys.path
; itself, a side effect of the interpreter, not of pytest.
pythonpath = .
